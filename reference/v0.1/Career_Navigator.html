  function route(next,focus=true){view=nav.some(n=>n[0]===next)?next:'home';render();window.scrollTo({top:0,behavior:'instant'});if(focus)document.querySelector('h1')?.focus();}
  function heading(eyebrow,title,description,actions=''){return `<div class="page-heading"><div><p class="eyebrow">${E(eyebrow)}</p><h1 tabindex="-1" class="focus-heading">${E(title)}</h1><p class="lead">${E(description)}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;}
  function privacy(){return `<details class="card privacy-drawer"><summary>Your data & saved work</summary><div class="privacy-grid"><div><label class="check-row"><input id="remember" type="checkbox" data-action="remember" ${state.settings.remember?'checked':''}><span><strong>Save on this device</strong><small>Only use this on a device you trust. Anyone using this browser may be able to open your saved work.</small></span></label><p style="margin-top:15px">With saving off, closing or reloading this page can lose your work. A backup is a readable JSON file containing your profile, jobs, drafts and plan. Keep it somewhere private.</p></div><div><p>No account, analytics or automatic AI requests. Use a display name if you prefer. Leave out identity documents, BSN, health information and other details you do not need for this task.</p><div class="actions">${btn('Download backup','export-backup','secondary small')}${btn('Import backup','import-backup','secondary small')}${btn('Clear my workspace','reset','danger small')}</div><p style="margin-top:13px">Clearing removes this app’s saved workspace. Copies you downloaded or shared with an AI service are separate.</p></div></div></details>`;}
  function render(){
    if(!state.jobs.some(j=>j.id===state.selectedJobId))state.selectedJobId=state.jobs[0]?.id||'';
    state.interview.questionIndex=Math.max(0,Math.min(D.interviewQuestions.length-1,state.interview.questionIndex));
    const current=nav.find(n=>n[0]===view);
    app.innerHTML=`<div class="app-shell"><aside class="sidebar"><a class="brand" href="#" data-action="navigate" data-view="home"><span class="brand-mark">${icon('compass',26)}</span><span>Career Navigator<small>Your next step</small></span></a><div><p class="nav-label">Your workspace</p><nav class="nav-list" aria-label="Main navigation">${nav.map((n,i)=>`<button type="button" class="nav-button" data-action="navigate" data-view="${n[0]}" ${view===n[0]?'aria-current="page"':''}>${icon(n[2],18)}<span>${n[1]}</span></button>`).join('')}</nav><div class="mobile-navigation"><label for="mobile-view">Go to section</label><select id="mobile-view">${nav.map(n=>`<option value="${n[0]}" ${view===n[0]?'selected':''}>${n[1]}</option>`).join('')}</select></div></div><div class="sidebar-bottom"><strong><span class="dot"></span> Built around your choices</strong>Start small. Keep your experience truthful. Take the next useful step.<p style="margin-top:15px;font-size:.65rem">Independent community tool · v0.1</p></div></aside><div class="main-wrap"><header class="topbar"><p class="crumb">My journey <span style="margin:0 9px;color:#a0ada4">/</span><strong>${current[1]}</strong></p><div class="top-actions"><span class="storage-status"><span class="dot"></span>${E(storageError||(state.settings.remember?'Saved on this device':'Session only'))}</span>${btn(`${icon('download',15)}Save backup`,'export-backup','secondary small')}</div></header><main id="main" class="content" tabindex="-1">${state.demo?`<div class="banner"><span><strong>Fictional example.</strong> This is Sam’s sample workspace. Every employer and advert here is made up.</span>${btn('Start my own','own','small')}</div>`:''}${({home:renderHome,profile:renderProfile,jobs:renderJobs,cv:renderCV,interview:renderInterview,plan:renderPlan,prompts:renderPrompts})[view]()}${privacy()}</main><footer class="footer"><span>Career Navigator · Your data, your decisions.</span><span>Independent tool. No employer or partner endorsement implied.</span></footer></div></div>`;
  }
  function renderHome(){
    const profileStarted=Boolean(state.profile.experience||state.profile.about||state.profile.skills);
    const steps=[['profile','person','01','Tell your story','Bring your skills, experience and goals together.',profileStarted?'Profile started':'Start with what you know'],['jobs','briefcase','02','Explore your options','Compare real job requirements with your evidence.',state.jobs.length?`${state.jobs.length} advert${state.jobs.length===1?'':'s'} in your workspace`:'Add your first advert'],['cv','document','03','Prepare with purpose','Build your application and practise your interview.',state.cv.reviewed?'CV reviewed':state.cv.summary?'CV draft started':'Create a truthful draft'],['plan','path','04','Make your next move','Turn one learning gap into a 90-day plan.',state.plan.nextAction?'Next action recorded':'Choose one small step']];
    return `<section class="hero"><div class="hero-copy"><p class="eyebrow">A fresh start, on your terms</p><h1 tabindex="-1" class="focus-heading">Your experience.<br><em>Your next step.</em></h1><p class="lead">Build a clear profile, explore jobs in the Netherlands and prepare an application you can stand behind.</p><div class="actions">${goButton(profileStarted?'Continue my profile':'Start my journey','profile','')}${btn('Try a fictional example','demo','secondary')}</div></div><div class="hero-visual" aria-hidden="true"><svg viewBox="0 0 260 280" fill="none"><path d="M40 251c0-87 176-45 176-126 0-35-38-49-65-30-35 25-10 68-51 68-26 0-38-21-29-38" stroke="#a9bda0" stroke-width="25"/><path d="M40 251c0-87 176-45 176-126 0-35-38-49-65-30-35 25-10 68-51 68-26 0-38-21-29-38" stroke="#e9f0e1" stroke-width="2" stroke-dasharray="5 7"/><circle cx="72" cy="120" r="16" fill="#123e3c"/><path d="m66 120 4 4 8-9" stroke="#d7eea6" stroke-width="2"/><circle cx="170" cy="57" r="43" fill="#f7f8f3"/><circle cx="170" cy="57" r="34" stroke="#c8d3c2"/><path d="m186 38-10 25-22 15 10-25Z" fill="#b85d2d"/><path d="m170 57-16 21 10-25Z" fill="#123e3c"/><circle cx="40" cy="249" r="7" fill="#b85d2d"/></svg><p class="hero-caption">One useful step at a time</p></div></section><section class="section-space"><div class="section-head"><h2>Your journey, made practical</h2><span class="muted">Start anywhere. Come back anytime.</span></div><div class="grid four">${steps.map(s=>`<button type="button" class="step-card" data-action="navigate" data-view="${s[0]}"><div class="step-top"><span class="step-icon">${icon(s[1],20)}</span><span class="step-num">${s[2]}</span></div><h3>${s[3]}</h3><p>${s[4]}</p><span class="step-status"><span class="dot"></span>${E(s[5])}</span></button>`).join('')}</div></section><section class="strip section-space"><div class="inline"><span class="icon-badge">${icon('spark',24)}</span><div><h3>A little help from AI. You stay in control.</h3><p>Six career prompts, ready for your preferred AI chat. Review what you share and what comes back.</p></div></div>${goButton('Open prompt studio '+icon('arrow',16),'prompts','secondary')}</section><div class="home-mini section-space">${icon('shield',18)}<span><strong>No sign-up or API key.</strong> The app works on your device. AI chats are an optional, separate step.</span></div>`;
  }
  function renderProfile(){return `${heading('01 / Tell your story','Start with your experience.','Write facts you can explain. You can use short notes and improve the wording later.',aiButton('profile'))}<div class="split"><section class="card"><div class="card-head"><div><h2>My professional profile</h2><p class="card-sub">Your starting point for a CV, job comparison and interview.</p></div></div><div class="fields">${field('Name for your CV','profile.name',{optional:true,placeholder:'Your name or a display name',hint:'Your name is omitted from AI prompts.'})}${field('Role or kind of work','profile.headline',{placeholder:'e.g. Data analyst or operations coordinator'})}${field('City or region','profile.city',{optional:true,placeholder:'e.g. Den Haag'})}${field('Availability','profile.availability',{optional:true,placeholder:'e.g. 32 hours per week'})}${field('Travel preference','profile.travel',{optional:true,full:true,placeholder:'e.g. Hybrid; up to 45 minutes each way'})}${field('What you bring','profile.about',{area:true,full:true,placeholder:'What work do you enjoy? What problems have you helped solve?',max:8000})}${field('Work experience & projects','profile.experience',{area:true,full:true,rows:6,placeholder:'Role, organisation, dates\nWhat you did, the tools you used, and a result you can support.'})}${field('Skills with examples','profile.skills',{area:true,full:true,placeholder:'e.g. Excel: cleaned weekly order records and checked duplicates.'})}${field('Education & training','profile.education',{area:true,full:true,placeholder:'Original qualification name, institution and year. Include relevant courses.'})}${field('Languages','profile.languages',{area:true,full:true,placeholder:'e.g. Arabic: fluent; English: B2 (self-assessed); Dutch: A2 (self-assessed)',max:2000})}${field('Paste an existing CV','profile.cvText',{optional:true,area:true,full:true,rows:5,max:30000,hint:'Optional source text for AI prompts. Remove contact details you do not want to share. Nothing is uploaded or parsed automatically.',placeholder:'Paste plain text here. Facts you want in the built-in CV must also be entered in the fields above.'})}</div><div class="form-footer"><span class="muted small">Only you decide what belongs in your story.</span>${goButton('Compare job options '+icon('arrow',16),'jobs','')}</div></section><aside class="grid"><section class="card soft"><p class="eyebrow">Make your experience visible</p><h3 style="margin-top:11px">Specific beats impressive.</h3><ul class="tip-list"><li>Describe an action you took.</li><li>Name tools only when you used them.</li><li>Use numbers when you can support them.</li><li>Include volunteering, study and personal projects if relevant.</li></ul></section><section class="card"><h3>Your starting point is valid.</h3><p class="card-sub">Keep original qualification names. Do not assume a Dutch diploma equivalence or a language level.</p><p class="card-sub">A gap in this profile means you have not recorded evidence yet. It is not a judgment about your potential.</p></section></aside></div>`;}

  function evidencePills(j){const s=C.requirementsSummary(j);return `<div class="metrics"><span class="pill">${s.supported} supported</span><span class="pill sand">${s.partial} partial</span><span class="pill gray">${s.missing} not shown</span><span class="pill gray">${s.unknown} unclear</span>${s.needsEvidence?`<span class="pill alert">${s.needsEvidence} need evidence</span>`:''}</div>`;}
  function jobField(label,key,j,opts={}){const id='job-'+key;return `<div class="field ${opts.full?'full':''}"><label for="${id}">${E(label)}${opts.optional?'<span class="optional">optional</span>':''}</label>${opts.area?`<textarea id="${id}" data-job-field="${key}" rows="${opts.rows||4}" maxlength="${opts.max||40000}" placeholder="${E(opts.placeholder||'')}">${E(j[key])}</textarea>`:`<input id="${id}" type="${key==='url'?'url':'text'}" data-job-field="${key}" value="${E(j[key])}" maxlength="${key==='url'?3000:500}" placeholder="${E(opts.placeholder||'')}">`}${opts.hint?`<span class="field-hint">${E(opts.hint)}</span>`:''}</div>`;}
  function renderJobs(){
    const j=job();
    const cards=state.jobs.map((v,i)=>`<article class="job-card ${j?.id===v.id?'active':''}"><button type="button" class="job-select" data-action="select-job" data-id="${E(v.id)}" aria-pressed="${j?.id===v.id}"><h3>${E(v.title||'Untitled advert')}</h3><p>${E(v.company||'Employer not entered')}</p><span class="pill ${j?.id===v.id?'':'gray'}" style="margin-top:10px">${j?.id===v.id?'Selected target':'Review advert'}</span></button><div class="job-rank"><small>Your order · ${i+1}</small><button type="button" data-action="move-job" data-id="${E(v.id)}" data-direction="-1" aria-label="Move ${E(v.title||'job')} earlier" ${i===0?'disabled':''}>↑</button><button type="button" data-action="move-job" data-id="${E(v.id)}" data-direction="1" aria-label="Move ${E(v.title||'job')} later" ${i===state.jobs.length-1?'disabled':''}>↓</button></div></article>`).join('');
    let detail=`<div class="empty">${icon('briefcase',38)}<h2>Bring a real job advert.</h2><p>Copy a vacancy you are interested in. This workspace helps you review it; it does not search job sites automatically.</p>${btn('Add my first advert','add-job','')}</div>`;
    if(j){detail=`<section class="card"><div class="card-head"><div><p class="eyebrow">Selected target</p><h2 style="margin-top:6px">Review this opportunity</h2></div>${btn('Remove advert','remove-job','ghost small',`data-id="${E(j.id)}"`)}</div><div class="fields">${jobField('Job title','title',j,{placeholder:'e.g. Junior Data Analyst'})}${jobField('Employer','company',j,{placeholder:'Organisation name'})}${jobField('Original advert link','url',j,{optional:true,full:true,placeholder:'https://…',hint:'Use the employer’s original listing when available. Check that the vacancy is still open.'})}${jobField('Paste the job advert','body',j,{area:true,full:true,rows:5,placeholder:'Responsibilities, requirements, hours, location and anything else relevant.'})}</div><div class="divider"></div><div class="card-head"><div><h3>Requirements & my evidence</h3><p class="card-sub">Add each requirement separately. You choose the status and supply the evidence.</p></div>${aiButton('fit','Help me review')}</div><div id="evidence-summary">${evidencePills(j)}</div><div id="requirements">${j.requirements.map((r,i)=>renderRequirement(r,i)).join('')}</div><div class="actions" style="margin-top:18px">${btn(icon('plus',16)+'Add a requirement','add-requirement','secondary',j.requirements.length>=20?'disabled':'')}</div><p class="source-note">Supported = evidence recorded · Partly supported = some evidence · Not shown = evidence not yet recorded · Unclear = requirement or meaning needs clarification. These are your review notes, not a hiring score.</p><div class="divider"></div>${jobField('My decision, gap & question for the employer','reason',j,{area:true,max:8000,placeholder:'Why might I choose this role?\nWhat should I learn or show?\nWhat do I need to ask the employer?'})}<div class="form-footer"><span class="muted small">You can reorder adverts in the list.</span>${goButton('Prepare my application '+icon('arrow',16),'cv','')}</div></section>`;}
    return `${heading('02 / Explore your options','Compare jobs with evidence.','Choose the requirements that matter. Separate what you can show from what you still need to ask.',aiButton('search','Explore with AI'))}<div class="job-layout"><aside class="job-list">${cards}${btn(icon('plus',16)+'Add an advert','add-job','secondary',state.jobs.length>=8?'disabled':'')}<p class="source-note">Up to 8 adverts per workspace. No scores or automatic ranking.</p></aside><div>${detail}</div></div>${state.jobs.length>1?`<section class="section-space"><div class="section-head"><h2>Your comparison at a glance</h2>${aiButton('compare','Compare with AI')}</div><div class="table-wrap"><table><thead><tr><th>My order</th><th>Opportunity</th><th>Requirement review</th><th>My decision & next question</th></tr></thead><tbody id="comparison-rows">${comparisonRows()}</tbody></table></div></section>`:''}`;
  }
  function comparisonRows(){return state.jobs.map((v,i)=>`<tr><td>${i+1}</td><td><strong>${E(v.title||'Untitled advert')}</strong><p>${E(v.company)}</p></td><td>${evidencePills(v)}</td><td>${E(v.reason||'Add a note after reviewing the requirements.')}</td></tr>`).join('');}
  function updateComparison(){const rows=document.getElementById('comparison-rows');if(rows)rows.innerHTML=comparisonRows();}
  function renderRequirement(r,i){const opts=[['unknown','Unclear'],['supported','Supported'],['partial','Partly supported'],['missing','Not shown']];return `<section class="requirement" data-requirement="${E(r.id)}"><div class="requirement-top"><strong>Requirement ${i+1}</strong>${btn('Remove','remove-requirement','ghost small',`data-id="${E(r.id)}"`)}</div><div class="fields"><div class="field full"><label for="req-${E(r.id)}-text">What does the advert ask for?</label><input type="text" id="req-${E(r.id)}-text" maxlength="2000" data-req-id="${E(r.id)}" data-req-field="text" value="${E(r.text)}" placeholder="e.g. Basic SQL and data checks"></div><div class="field"><label for="req-${E(r.id)}-status">My evidence status</label><select id="req-${E(r.id)}-status" data-req-id="${E(r.id)}" data-req-field="status">${opts.map(o=>`<option value="${o[0]}" ${r.status===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class="field"><label for="req-${E(r.id)}-next">Next step or question</label><input type="text" id="req-${E(r.id)}-next" maxlength="3000" data-req-id="${E(r.id)}" data-req-field="nextStep" value="${E(r.nextStep)}" placeholder="What could I show, learn or ask?"></div><div class="field full"><label for="req-${E(r.id)}-evidence">Evidence from my experience</label><textarea id="req-${E(r.id)}-evidence" rows="2" maxlength="6000" data-req-id="${E(r.id)}" data-req-field="evidence" placeholder="Name a real task, project or example you can explain.">${E(r.evidence)}</textarea><span class="evidence-warning" id="req-${E(r.id)}-warning">${['supported','partial'].includes(r.status)&&!r.evidence.trim()?'Add evidence. This requirement is counted as unclear until you do.':''}</span></div></div></section>`;}
  function renderCV(){const j=job();return `${heading('03 / Prepare with purpose','An application you can stand behind.','Start with the facts you recorded. Edit the wording and check each claim before you download.',aiButton('tailor','Tailor with AI'))}<div class="split"><div class="grid"><section class="card"><div class="card-head"><div><h2>My CV draft</h2><p class="card-sub">${j?`Selected target: ${E(j.title||'Untitled advert')}`:'You can create a general CV or select a target advert first.'}</p></div>${btn('Copy my profile into CV','draft-cv','secondary small')}</div><div class="fields">${field('Professional headline','cv.headline',{full:true,max:2000})}${field('Profile summary','cv.summary',{area:true,full:true,max:20000})}${field('Experience & projects','cv.experience',{area:true,full:true,rows:7,max:20000,hint:'Use reverse chronological order. Keep dates, job titles and results accurate.'})}${field('Education & training','cv.education',{area:true,full:true,max:20000})}${field('Skills','cv.skills',{area:true,full:true,max:20000})}${field('Languages','cv.languages',{area:true,full:true,max:20000})}</div></section><section class="card"><div class="card-head"><div><h2>Motivation letter</h2><p class="card-sub">An optional short letter you can adapt to the selected role.</p></div>${aiButton('letter','Prepare a letter')}</div>${field('Letter text','cv.letter',{area:true,rows:7,max:20000,hint:'Describe your interest in your own words. Check employer details, motivation and every achievement.'})}</section><section class="card"><h2>Review, then download</h2><p class="card-sub">Your CV download uses your name from My profile and the text above. You can add private contact details after downloading.</p><ul class="tip-list"><li>Every skill, qualification, date and result is something I can explain.</li><li>I removed placeholder text and checked the selected employer.</li><li>I read any AI wording carefully and made it my own.</li></ul><div class="review-box" style="margin-top:20px"><label class="check-row"><input id="cv-reviewed" type="checkbox" data-action="review-cv" ${state.cv.reviewed?'checked':''}><span>I have checked these CV and letter claims.<small>Editing your profile or application makes a new review necessary.</small></span></label></div><p class="review-status" id="review-status">${state.cv.reviewed?'Reviewed by you. Ready to download.':'Needs your review before downloading a CV.'}</p><div class="actions" style="margin-top:18px">${btn(icon('download',16)+'Download CV & letter','export-cv','',state.cv.reviewed?'':'disabled')}${btn(cvPreview?'Hide preview':'Preview CV text','preview-cv','secondary')}</div><p class="source-note">Downloads an editable, printable HTML document. Open it in a browser, then use Print → Save as PDF. Review the page breaks before sharing.</p></section>${cvPreview?renderCVPreview():''}</div><aside class="grid"><section class="card soft"><p class="eyebrow">Truthful by design</p><h3 style="margin-top:10px">Your profile is the source.</h3><p class="card-sub">“Copy my profile into CV” copies the structured fields you wrote. It does not invent achievements or interpret your pasted CV.</p><p class="card-sub">AI can help with language and structure. Paste useful text into the relevant fields and review it yourself.</p></section><section class="card"><h3>Ready to practise?</h3><p class="card-sub">Turn one example from this CV into a clear interview answer.</p><div style="margin-top:15px">${goButton('Practise an interview','interview','secondary small')}</div></section></aside></div>`;}
  function renderCVPreview(){return `<section class="preview-sheet" aria-label="CV text preview">${state.demo?'<p class="pill sand">Fictional example</p>':''}<h2>${E(state.profile.name||'Your name')}</h2><p class="cv-headline">${E(state.cv.headline)}</p>${[['Profile','summary'],['Experience','experience'],['Education','education'],['Skills','skills'],['Languages','languages']].filter(x=>state.cv[x[1]]).map(x=>`<h3>${x[0]}</h3><p>${E(state.cv[x[1]])}</p>`).join('')}</section>`;}
  function renderInterview(){const idx=Math.min(state.interview.questionIndex,D.interviewQuestions.length-1);state.interview.questionIndex=idx;const q=D.interviewQuestions[idx];return `${heading('03 / Prepare with purpose','Practise one answer at a time.','Use a real example. Write your answer, reflect, and make one improvement.',aiButton('interview','Practise with AI'))}<div class="split"><section class="card interview-card"><div class="question-counter"><span class="eyebrow">Question ${idx+1} of ${D.interviewQuestions.length}</span><div class="question-progress" aria-hidden="true">${D.interviewQuestions.map((_,i)=>`<span class="${i<=idx?'active':''}"></span>`).join('')}</div></div><h2 class="question-text">${E(q.question)}</h2><p class="question-tip">${E(q.tip)}</p>${field('My answer','interview.answers.'+q.id,{area:true,rows:8,max:12000,placeholder:'Write an answer you could say in your own words.'})}<div class="divider"></div><h3>My self-review</h3><p class="card-sub">Did I give a specific example? Is my own action clear? Is the result factual? What did I learn?</p><div style="margin-top:17px">${field('One improvement for my next attempt','interview.notes.'+q.id,{area:true,rows:3,max:12000,placeholder:'e.g. Explain my contribution more clearly, then shorten the background.'})}</div><div class="form-footer">${btn('← Previous','question','secondary',`data-direction="-1" ${idx===0?'disabled':''}`)}${btn(idx===D.interviewQuestions.length-1?'Make my learning plan '+icon('arrow',16):'Next question '+icon('arrow',16),idx===D.interviewQuestions.length-1?'navigate':'question','',idx===D.interviewQuestions.length-1?'data-view="plan"':'data-direction="1"')}</div></section><aside class="grid"><section class="card soft"><p class="eyebrow">A simple answer structure</p><h3 style="margin-top:10px">Try STAR.</h3><div class="star-grid"><div><strong>S</strong><small>Situation<br>What was happening?</small></div><div><strong>T</strong><small>Task<br>What was your goal?</small></div><div><strong>A</strong><small>Action<br>What did you do?</small></div><div><strong>R</strong><small>Result<br>What changed?</small></div></div></section><section class="card"><h3>Practice, without a score.</h3><p class="card-sub">This workspace saves your writing and reflections. It does not rate your language, accent or hiring chances.</p><p class="card-sub">For feedback, ask a trusted person or use the optional AI interview prompt.</p></section></aside></div>`;}

  function renderPlan(){
    const role=D.roles.find(r=>r.id===state.plan.roleId);
    return `${heading('04 / Make your next move','A useful plan for the next 90 days.','Choose a pace that fits your starting point. Focus on three priorities, one project and one next step.',btn(icon('download',16)+'Download my work pack','export-pack','secondary'))}<section class="card soft"><div class="template-row"><div class="field"><label for="role-template">Start from a role template</label><select id="role-template"><option value="custom" ${state.plan.roleId==='custom'?'selected':''}>Custom career — make my own plan</option>${D.roles.map(r=>`<option value="${E(r.id)}" ${r.id===state.plan.roleId?'selected':''}>${E(r.role)}</option>`).join('')}</select></div>${btn('Use this template','apply-template','')}</div><p class="source-note">Nine Data & AI starting points, or choose any other career. These are workshop adaptations of public learning maps, not official 90-day programmes or hiring requirements.</p>${role?`<div class="divider"></div><h3>${E(role.role)}: a starting point</h3><p class="card-sub">${E(role.starting_point)}</p><div class="roadmap-links">${role.roadmaps.map(r=>{const url=C.safeUrl(r.url);return url?`<a href="${E(url)}" target="_blank" rel="noopener noreferrer">${E(r.title)} roadmap ↗</a>`:'';}).join('')}</div>${role.mapping_note?`<p class="source-note">${E(role.mapping_note)}</p>`:''}`:''}</section><section class="card section-space"><h2>My direction</h2><div class="fields" style="margin-top:20px">${field('My target role','plan.targetRole',{full:true,placeholder:'The kind of work I want to move towards'})}${field('Priority 1','plan.priorities.0',{full:true,max:4000,placeholder:'The first skill or capability to develop'})}${field('Priority 2','plan.priorities.1',{full:true,max:4000})}${field('Priority 3','plan.priorities.2',{full:true,max:4000})}${field('One portfolio project','plan.project',{area:true,full:true,max:8000,placeholder:'A small project that shows what I can do, using public or invented data.'})}</div></section><section class="phase-grid" aria-label="My 90-day milestones">${[['day30','01–30','Build a foundation','Learn the essentials and produce something small.','phase_1'],['day60','31–60','Build something useful','Apply the skills to your project. Keep the scope manageable.','phase_2'],['day90','61–90','Test, explain & share','Ask for feedback, improve the work and explain your choices.','phase_3']].map((p)=>`<section class="phase"><span class="phase-number">DAYS ${p[1]}</span><h3>${E(role?role[p[4]].label:p[2])}</h3><p>${E(role?role[p[4]].slide:p[3])}</p>${role?`<details class="details"><summary>Suggested activities</summary><ul class="tip-list">${role[p[4]].actions.map(a=>`<li>${E(a)}</li>`).join('')}</ul></details>`:''}<label for="plan-${p[0]}">What I will be able to show</label><textarea id="plan-${p[0]}" data-bind="plan.${p[0]}" maxlength="8000" rows="5" placeholder="Name an observable output, not just a course to finish.">${E(state.plan[p[0]])}</textarea></section>`).join('')}</section><div class="grid two section-space"><section class="card"><h2>Make the first step concrete.</h2><div style="margin-top:20px">${field('My next action','plan.nextAction',{area:true,max:8000,rows:3,placeholder:'A small action I can start within the next 48 hours.'})}<div class="fields" style="margin-top:18px">${field('When I will start','plan.nextDate',{type:'date'})}${field('Hours per week','plan.hours',{type:'number',hint:'Choose a realistic whole number from 1 to 40.'})}</div></div></section><section class="card ${role?'sand':'soft'}"><p class="eyebrow">A plan you can adapt</p><h3 style="margin-top:11px">${role?'If you are starting from the beginning':'Progress needs evidence, not perfection.'}</h3><p class="card-sub">${E(role?role.beginner_adjustment:'Reduce the scope when you need to. A small project you can explain is a useful starting point for a conversation.')}</p>${role?`<p class="card-sub"><strong>Suggested tools:</strong> ${E(role.tools)}</p><details class="details"><summary>How to check the project</summary><ul class="tip-list">${role.acceptance.map(a=>`<li>${E(a)}</li>`).join('')}</ul></details>`:''}<p class="source-note">Learning plans do not guarantee a job. Adapt the sequence to your experience, time and the requirements of real roles.</p></section></div><div class="form-footer"><p class="muted small">Include your profile, evidence, practice and plan in one printable work pack.</p>${btn(icon('download',16)+'Download my work pack','export-pack','')}</div>`;
  }
  function renderPrompts(){
    const step=state.ai.step;
    const current=promptSteps.find(s=>s[0]===step);
    const number={profile:1,search:2,fit:3,tailor:4,interview:5,letter:6}[step];
    const original=D.prompts.find(p=>p.number===number);
    return `${heading('Optional / AI prompt studio','Better context. More useful help.','Prepare a prompt here, run it in your own AI chat, then bring back a draft to review.')}<div class="prompt-layout"><aside><div class="prompt-tabs" aria-label="Choose a prompt">${promptSteps.map(s=>`<button type="button" class="prompt-tab" aria-pressed="${s[0]===step}" data-action="select-prompt" data-step="${s[0]}"><span>${s[1]}</span>${s[2]}</button>`).join('')}</div><p class="source-note">The six original career prompts plus an advert-comparison helper. The app prepares text; your chosen AI service runs it.</p></aside><div class="grid"><section class="card"><div class="prompt-steps"><span><b>1</b> Preview</span><span>→</span><span><b>2</b> Copy & run in AI</span><span>→</span><span><b>3</b> Review the result</span></div><h2>${current[2]}</h2><p class="card-sub">The prepared prompt combines the original workshop idea with your recorded facts and factuality guidance.</p><div class="fields" style="margin-top:23px"><div class="field"><label for="ai-language">Ask AI to explain in</label><input id="ai-language" type="text" data-bind="ai.language" list="languages" maxlength="100" value="${E(state.ai.language)}" placeholder="English"><datalist id="languages"><option value="English"><option value="Dutch"><option value="Arabic"><option value="Ukrainian"><option value="French"><option value="Turkish"><option value="Persian"><option value="Tigrinya"><option value="Amharic"></datalist><span class="field-hint">This changes the AI request. The app interface is in English.</span></div><div class="field"><label>Context included</label><p class="field-hint" style="padding:10px 0">Your profile${['compare','search'].includes(step)?' and saved adverts':['fit','tailor','interview','letter'].includes(step)?' and selected advert':''}. Review the exact text below. Dedicated name field is omitted; free text may still include personal details.</p></div>${field('Anything else to ask','ai.extra',{optional:true,area:true,rows:2,full:true,max:6000,placeholder:'e.g. Use plain language. Help me explain a career change.'})}</div><div class="field" style="margin-top:20px"><label for="prompt-preview">Exact prompt to copy</label><textarea id="prompt-preview" class="prompt-preview" readonly rows="13" spellcheck="false">${E(C.buildPrompt(step,state,D))}</textarea><span class="field-hint">Read this before sharing. Remove private details from your source fields if needed. The app sends nothing to an AI provider automatically.</span></div><div class="actions" style="margin-top:15px">${btn(icon('copy',16)+'Copy this prompt','copy-prompt','')}${btn('Select text manually','select-prompt-text','secondary')}</div><div class="provider-links"><span class="muted">Then open your AI chat:</span><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT ↗</a><a href="https://claude.ai/" target="_blank" rel="noopener noreferrer">Claude ↗</a><span class="muted">or another service you trust.</span></div><p class="source-note">AI providers have their own terms, privacy controls and usage limits. Use an account you already understand. No subscription or API key is needed by Career Navigator itself.</p><details class="details"><summary>${original?'Read the original workshop prompt':'About this comparison helper'}</summary><div class="original-text">${E(original?original.text:'This additional prompt asks an AI service to compare your pasted adverts using explicit evidence. It suggests an order for you to consider; it does not make a hiring decision.')}</div>${original?'<p class="source-note">The original text is preserved for reference. The prepared prompt adds safeguards and replaces numeric matching scores with evidence categories. Source: <a href="https://nn-job-prompts.netlify.app/" target="_blank" rel="noopener noreferrer">original workshop prompt page</a>.</p>':''}</details></section><section class="card"><div class="card-head"><div><h2>Bring back a draft</h2><p class="card-sub">Paste a response from your AI chat. Treat it as unverified working text.</p></div><span class="pill sand">Needs human review</span></div>${field('AI response or working notes','ai.drafts.'+step,{area:true,rows:8,max:40000,placeholder:'Paste the response here. Check facts, missing evidence, assumptions and tone.'})}<div class="review-box" style="margin-top:18px"><h3>Before you use the response</h3><p class="card-sub">Can you point to evidence for every claim? Are vacancies real and current? Are unknowns labelled? Keep only wording you understand and can support.</p></div><div class="actions" style="margin-top:18px">${goButton(step==='compare'||step==='fit'||step==='search'?'Review my job evidence':step==='interview'?'Return to interview practice':'Edit my application',step==='compare'||step==='fit'||step==='search'?'jobs':step==='interview'?'interview':'cv','secondary')}</div><p class="source-note">Drafts are saved with your workspace when you choose to save or export. They are not applied to your CV automatically.</p></section></div></div>`;
  }

  function download(filename,text,type='text/html;charset=utf-8'){
    const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  }
  function hasWork(){return Boolean(Object.values(state.profile).some(Boolean)||state.jobs.length||Object.entries(state.cv).some(([k,v])=>k!=='reviewed'&&v)||['targetRole','project','day30','day60','day90','nextAction','nextDate'].some(k=>state.plan[k])||state.plan.priorities.some(Boolean)||Object.values(state.interview.answers).some(Boolean)||Object.values(state.interview.notes).some(Boolean)||Object.values(state.ai.drafts).some(Boolean)||state.ai.extra);}
  function removeSaved(){try{localStorage.removeItem(STORAGE_KEY);storageError='';return true;}catch(_){storageError='Could not clear saved data — check browser settings';return false;}}
  function replaceWorkspace(next,message){state=next;state.settings.remember=false;cvPreview=false;if(!removeSaved())notify('The workspace was changed here, but this browser did not allow removal of earlier saved data. Clear this app’s site data in browser settings.',true);else notify(message);render();}
  function uid(prefix){return prefix+'-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));}
  function updatePrompt(){const el=document.getElementById('prompt-preview');if(el)el.value=C.buildPrompt(state.ai.step,state,D);}
  function updateEvidence(){const j=job();if(!j)return;const el=document.getElementById('evidence-summary');if(el)el.innerHTML=evidencePills(j);for(const r of j.requirements){const warning=document.getElementById('req-'+r.id+'-warning');if(warning)warning.textContent=['supported','partial'].includes(r.status)&&!r.evidence.trim()?'Add evidence. This requirement is counted as unclear until you do.':'';}}
  function updateField(event){
    const el=event.target;
    if(!el.matches('input,textarea,select'))return;
    let previous,setValue;
    if(el.dataset.bind){const path=el.dataset.bind;previous=get(path);setValue=(v)=>set(path,v);}
    else if(el.dataset.jobField){const j=job();if(!j)return;const key=el.dataset.jobField;previous=j[key];setValue=(v)=>{j[key]=v;};}
    else if(el.dataset.reqId){const r=job()?.requirements.find(r=>r.id===el.dataset.reqId);if(!r)return;const key=el.dataset.reqField;previous=r[key];setValue=(v)=>{r[key]=v;};}
    else return;
    let value=el.value;
    if(el.type==='number'){value=Math.min(40,Math.max(1,Math.round(Number(value)||6)));if(el.value&&String(value)!==el.value)el.value=String(value);}
    setValue(value);
    if(new TextEncoder().encode(JSON.stringify(state)).length>950000){setValue(previous);el.value=previous??'';notify('This workspace is nearly full. Shorten a long advert or draft, or download a work pack and start a new workspace.',true);return;}
    if(el.dataset.bind?.startsWith('profile.')||el.dataset.bind?.startsWith('cv.')||el.dataset.jobField)invalidateReview();
    if(el.dataset.bind?.startsWith('cv.')){const preview=document.querySelector('.preview-sheet');if(preview)preview.outerHTML=renderCVPreview();}
    if(el.dataset.reqId)updateEvidence();
    if(el.dataset.reqId||el.dataset.jobField)updateComparison();
    if(el.dataset.bind?.startsWith('ai.'))updatePrompt();
    if(el.dataset.jobField==='title'||el.dataset.jobField==='company'){
      const j=job();const card=[...document.querySelectorAll('.job-select')].find(e=>e.dataset.id===j.id);
      if(card){card.querySelector('h3').textContent=j.title||'Untitled advert';card.querySelector('p').textContent=j.company||'Employer not entered';}
    }
    save();
  }
  app.addEventListener('input',updateField);
  app.addEventListener('change',event=>{if(event.target.id==='mobile-view'){route(event.target.value);return;}if(event.target.matches('select'))updateField(event);});
  app.addEventListener('click',async function(event){
    const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
    if(el.tagName==='A')event.preventDefault();
    try{
      switch(action){
        case 'navigate': route(el.dataset.view);break;
        case 'demo':
          if(hasWork()&&!confirm('Replace this workspace with the fictional example? Download a backup first if you want to keep your current work.'))return;
          replaceWorkspace(C.normalizeWorkspace(D.demo),'Fictional example loaded. Explore freely, then choose “Start my own”.');route('home');break;
        case 'own':
          if(!confirm('Start a clean workspace? This removes the fictional example and any edits you made to it.'))return;
          replaceWorkspace(C.newWorkspace(),'Your own workspace is ready.');route('profile');break;
        case 'reset':
          if(!confirm('Clear this workspace and its saved data in this browser? Download a backup first if you want to keep it. Downloaded files and AI chats are not deleted.'))return;
          replaceWorkspace(C.newWorkspace(),'Workspace cleared.');route('home');break;
        case 'remember':
          state.settings.remember=el.checked;
          if(state.settings.remember){save();if(state.settings.remember)notify('Workspace saved on this device. You can turn this off at any time.');}
          else if(removeSaved())notify('Device saving is off. Download a backup before closing this page.');
          else notify('This browser could not remove the earlier saved copy. Clear this app’s site data in browser settings.',true);
          updateStorageStatus();break;
        case 'export-backup':{
          const data=JSON.stringify({...state,settings:{remember:false}},null,2);C.parseWorkspace(data);
          download(state.demo?'career-navigator-fictional-example.json':'career-navigator-backup.json',data,'application/json');notify('Backup downloaded. It contains your workspace text; keep it private.');break;}
        case 'import-backup':document.getElementById('import-file').click();break;
        case 'add-job':{
          if(state.jobs.length>=8){notify('You can keep up to 8 adverts in one workspace.',true);return;}
          const id=uid('job');state.jobs.push({id,title:'',company:'',url:'',body:'',reason:'',requirements:[]});state.selectedJobId=id;invalidateReview();save();render();document.getElementById('job-title')?.focus();break;}
        case 'select-job':state.selectedJobId=el.dataset.id;invalidateReview();save();render();document.getElementById('job-title')?.focus();break;
        case 'remove-job':
          if(!confirm('Remove this advert and its requirement review?'))return;
          state.jobs=state.jobs.filter(j=>j.id!==el.dataset.id);if(state.selectedJobId===el.dataset.id)state.selectedJobId=state.jobs[0]?.id||'';invalidateReview();save();render();break;
        case 'move-job':{
          const i=state.jobs.findIndex(j=>j.id===el.dataset.id);const n=i+Number(el.dataset.direction);if(i<0||n<0||n>=state.jobs.length)return;[state.jobs[i],state.jobs[n]]=[state.jobs[n],state.jobs[i]];save();render();notify('Your advert order was updated.');break;}
        case 'add-requirement':{
          const j=job();if(!j||j.requirements.length>=20)return;const id=uid('req');j.requirements.push({id,text:'',status:'unknown',evidence:'',nextStep:''});save();render();document.getElementById('req-'+id+'-text')?.focus();break;}
        case 'remove-requirement':{const j=job();if(!j)return;const r=j.requirements.find(r=>r.id===el.dataset.id);if((r?.text||r?.evidence)&&!confirm('Remove this requirement and its evidence?'))return;j.requirements=j.requirements.filter(r=>r.id!==el.dataset.id);save();render();break;}
        case 'draft-cv':
          if(Object.entries(state.cv).some(([k,v])=>k!=='reviewed'&&k!=='letter'&&v)&&!confirm('Replace the CV fields with your structured profile? Your motivation letter will be kept.'))return;
          state.cv=C.draftCvFromProfile(state);save();render();notify('Profile facts copied into the CV. Edit and review them before downloading.');break;
        case 'review-cv':state.cv.reviewed=el.checked;save();document.querySelector('[data-action="export-cv"]').disabled=!state.cv.reviewed;document.getElementById('review-status').textContent=state.cv.reviewed?'Reviewed by you. Ready to download.':'Needs your review before downloading a CV.';break;
        case 'preview-cv':cvPreview=!cvPreview;render();if(cvPreview)document.querySelector('.preview-sheet')?.scrollIntoView({block:'start',behavior:'instant'});break;
        case 'export-cv':
          if(!['summary','experience','education','skills','languages','headline'].some(k=>state.cv[k].trim())){notify('Add some CV content before downloading.',true);return;}
          download(state.demo?'fictional-example-cv.html':'my-career-cv.html',C.buildCVHTML(state));notify('CV downloaded. Open it in a browser to print or save as PDF.');break;
        case 'question':state.interview.questionIndex=Math.max(0,Math.min(D.interviewQuestions.length-1,state.interview.questionIndex+Number(el.dataset.direction)));save();render();document.querySelector('.question-text')?.scrollIntoView({block:'center',behavior:'instant'});document.getElementById('field-interview-answers-'+D.interviewQuestions[state.interview.questionIndex].id)?.focus();break;
        case 'apply-template':{
          const id=document.getElementById('role-template').value;const role=D.roles.find(r=>r.id===id);
          if((['targetRole','project','day30','day60','day90','nextAction','nextDate'].some(k=>state.plan[k])||state.plan.priorities.some(Boolean))&&!confirm('Replace this learning plan with the selected starting template? Your profile, jobs and CV will be kept.'))return;
          state.plan=C.planFromRole(role);save();render();notify(id==='custom'?'A blank plan is ready for any career direction.':'Template loaded. Adjust the priorities, scope and pace to fit you.');break;}
        case 'export-pack':download(state.demo?'fictional-example-work-pack.html':'my-career-work-pack.html',C.buildPackHTML(state,D));notify('Work pack downloaded. Open it in a browser to print or save as PDF.');break;
        case 'ai':state.ai.step=el.dataset.step;save();route('prompts');break;
        case 'select-prompt':state.ai.step=el.dataset.step;save();render();document.querySelector('h1')?.focus();break;
        case 'select-prompt-text':{const preview=document.getElementById('prompt-preview');preview.focus();preview.select();notify('Text selected. Use your browser’s Copy command, Ctrl+C or ⌘C.');break;}
        case 'copy-prompt':{
          const preview=document.getElementById('prompt-preview');const text=preview.value;
          try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);notify('Prompt copied. Open your AI chat and paste it when you are ready.');}
          catch(_){preview.focus();preview.select();notify('Automatic copying is unavailable. Text is selected: use Copy, Ctrl+C or ⌘C.');}break;}
      }
    }catch(error){notify(error.message||'That action could not be completed. Your current work is still here.',true);}
  });
  document.getElementById('import-file').addEventListener('change',async function(event){
    const file=event.target.files[0];if(!file)return;
    try{
      if(file.size>1048576)throw new Error('This backup is larger than one MiB. Choose a smaller Career Navigator backup.');
      const next=C.parseWorkspace(await file.text());
      if(hasWork()&&!confirm('Import this backup and replace your current workspace? Download your current work first if you want to keep it.'))return;
      replaceWorkspace(next,'Backup imported. Device saving is off and your CV needs a fresh review.');route('home');
    }catch(error){notify('Import could not be completed. '+error.message+' Your current work has been kept.',true);}
    finally{event.target.value='';}
  });
  try{
    const stored=localStorage.getItem(STORAGE_KEY);
    if(stored){const loaded=C.normalizeWorkspace(JSON.parse(stored));if(loaded.settings.remember){state=loaded;startupMessage='Your saved workspace is open.';}else removeSaved();}
  }catch(_){storageError='Saved data unavailable — import a backup if needed';startupMessage='Saved data could not be opened. You can work here and download a backup; your saved copy has not been overwritten.';}
  render();
  if(startupMessage)notify(startupMessage,Boolean(storageError));
})();

</script>
</body>
